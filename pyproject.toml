[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "doc2tex"
dynamic = ["version"]
description = "Local DOCX <-> LaTeX converter with a CLI and a small web UI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["latex", "docx", "word", "converter", "omml", "bibtex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "python-docx>=1.1",
    "Pillow>=10.0",
    "Flask>=3.0",
]

[project.urls]
Homepage = "https://github.com/IOST-ASCOL/doc2tex"
Issues = "https://github.com/IOST-ASCOL/doc2tex/issues"
Changelog = "https://github.com/IOST-ASCOL/doc2tex/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
doc2tex = "doc2tex.cli:main"
doc2tex-web = "doc2tex.web:start_server"

[tool.setuptools]
packages = ["doc2tex"]

[tool.setuptools.dynamic]
version = { attr = "doc2tex.__version__" }

[tool.setuptools.package-data]
doc2tex = ["templates/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
